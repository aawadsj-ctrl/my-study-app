<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مذاكرتي الذكية 🎓</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f4f8; margin: 0; padding: 15px; color: #333; }
        .container { max-width: 500px; margin: auto; background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: #2b6cb0; font-size: 24px; }
        .points-bar { background: #ebf8ff; padding: 10px; border-radius: 10px; text-align: center; font-weight: bold; color: #2c5282; margin-bottom: 15px; border: 1px solid #bee3f8; }
        input[type="password"], input[type="file"] { width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; background: #fff; }
        button { width: 100%; background-color: #3182ce; color: white; border: none; padding: 12px; font-size: 16px; border-radius: 8px; cursor: pointer; font-weight: bold; margin-top: 10px; }
        button:hover { background-color: #2b6cb0; }
        .card { background: #f7fafc; padding: 15px; border-radius: 10px; margin-top: 15px; border-right: 4px solid #3182ce; }
        .quiz-option { display: block; background: #edf2f7; padding: 10px; margin: 5px 0; border-radius: 8px; cursor: pointer; }
        .quiz-option:hover { background: #e2e8f0; }
        #loading { text-align: center; display: none; font-weight: bold; color: #3182ce; margin: 15px 0; }
        img { max-width: 100%; border-radius: 10px; margin-top: 10px; display: none; }
        #pdfPreview { display: none; background: #edf2f7; padding: 12px; border-radius: 8px; margin-top: 10px; text-align: center; font-weight: bold; color: #2d3748; border: 1px dashed #a0aec0; }
    </style>
</head>
<body>

<div class="container">
    <h1>📚 مساعد المذاكرة الذكي</h1>
    
    <div class="points-bar" id="pointsDisplay">
        نقاطك: 0 ⭐ | المستوى: طالبة مجتهدة 🌱
    </div>

    <input type="password" id="apiKey" placeholder="ضعي مفتاح Gemini API هنا (مرة واحدة فقط)">
    
    <label style="font-weight:bold; display:block; margin-top:10px;">صوّري الدرس أو اختاري صورة / ملف PDF:</label>
    <!-- تم إزالة capture للسماح باختيار الملفات من المعرض ومدير الملفات وإضافة دعم PDF -->
    <input type="file" id="imageInput" accept="image/*,application/pdf,.pdf" onchange="previewFile(event)">
    
    <img id="preview" alt="معاينة الصورة">
    <div id="pdfPreview">📄 تم اختيار ملف PDF بنجاح!</div>

    <button onclick="analyzeLesson()">ابدأ الشرح والمسابقة ✨</button>
    <div id="loading">⏳ جاري قراءة الدرس وتجهيز الشرح...</div>

    <div id="resultArea" style="display:none;">
        <div class="card">
            <h3>📝 ملخص الدرس:</h3>
            <p id="summaryText" style="white-space: pre-line;"></p>
        </div>

        <div class="card">
            <h3>🧠 مخطط لتسهيل الحفظ:</h3>
            <p id="mindmapText" style="white-space: pre-line;"></p>
        </div>

        <div class="card">
            <h3>🎧 الشرح الصوتي:</h3>
            <p id="explanationText"></p>
            <button onclick="speakText()" style="background-color: #38a169;">🔊 اسمعي الشرح بصوت عالي</button>
        </div>

        <div class="card">
            <h3>🎮 مسابقة الجوائز:</h3>
            <div id="quizContainer"></div>
        </div>
    </div>
</div>

<script>
    let points = parseInt(localStorage.getItem('studyPoints')) || 0;
    document.getElementById('apiKey').value = localStorage.getItem('geminiKey') || '';
    updatePointsUI();

    function updatePointsUI() {
        let badge = "طالبة مجتهدة 🌱";
        if (points >= 30) badge = "بطلة المذاكرة 🥉";
        if (points >= 70) badge = "عبقرية الدفعة 👑";
        document.getElementById('pointsDisplay').innerText = `نقاطك: ${points} ⭐ | المستوى: ${badge}`;
        localStorage.setItem('studyPoints', points);
    }

    function previewFile(event) {
        const file = event.target.files[0];
        const imgOutput = document.getElementById('preview');
        const pdfOutput = document.getElementById('pdfPreview');

        if (!file) return;

        if (file.type === "application/pdf" || file.name.toLowerCase().endsWith(".pdf")) {
            imgOutput.style.display = 'none';
            pdfOutput.innerText = `📄 ملف PDF جاهز للشرح: ${file.name}`;
            pdfOutput.style.display = 'block';
        } else {
            pdfOutput.style.display = 'none';
            const reader = new FileReader();
            reader.onload = function(){
                imgOutput.src = reader.result;
                imgOutput.style.display = 'block';
            };
            reader.readAsDataURL(file);
        }
    }

    function toBase64(file) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = () => resolve(reader.result);
            reader.onerror = error => reject(error);
        });
    }

    async function analyzeLesson() {
        const apiKey = document.getElementById('apiKey').value.trim();
        const fileInput = document.getElementById('imageInput');
        
        if (!apiKey) { alert("من فضلك أدخلي مفتاح API أولاً!"); return; }
        if (!fileInput.files || !fileInput.files[0]) { alert("من فضلك صوّري الصفحة أو اختاري صورة أو ملف PDF!"); return; }

        localStorage.setItem('geminiKey', apiKey);
        document.getElementById('loading').style.display = 'block';
        document.getElementById('resultArea').style.display = 'none';

        const file = fileInput.files[0];
        const base64File = await toBase64(file);
        const fileData = base64File.split(',')[1];
        
        // تحديد نوع الملف بدقة حتى لو لم يتعرف عليه متصفح الموبايل تلقائياً
        let mimeType = file.type;
        if (!mimeType) {
            mimeType = file.name.toLowerCase().endsWith('.pdf') ? 'application/pdf' : 'image/jpeg';
        }

        const prompt = `أنت معلم مصري مرح تساعد طالبة في المرحلة الإعدادية. اقرأ محتوى الدرس المرفق (صورة أو ملف PDF) وأجب بصيغة JSON فقط بدون أي كلام إضافي، بالهيكل التالي:
        {
            "summary": "ملخص منظم في نقاط قصيرة",
            "mindmap": "مخطط نصي بالأسهم والرموز يربط الأفكار",
            "explanation": "شرح مبسط باللهجة المصرية العامية بدون رموز",
            "quiz": [
                {"q": "السؤال الأول", "options": ["اختيار 1", "اختيار 2", "اختيار 3"], "ans": "الإجابة الصحيحة مطابقة لأحد الاختيارات"},
                {"q": "السؤال الثاني", "options": ["اختيار 1", "اختيار 2", "اختيار 3"], "ans": "الإجابة الصحيحة مطابقة لأحد الاختيارات"}
            ]
        }`;

        try {
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{
                        parts: [
                            { text: prompt },
                            { inline_data: { mime_type: mimeType, data: fileData } }
                        ]
                    }],
                    generationConfig: { response_mime_type: "application/json" }
                })
            });

            const data = await response.json();
            if (!data.candidates || !data.candidates[0]) {
                throw new Error("لم يتم استلام رد صحيح من النموذج");
            }
            const resultText = data.candidates[0].content.parts[0].text;
            const lesson = JSON.parse(resultText);

            document.getElementById('summaryText').innerText = lesson.summary;
            document.getElementById('mindmapText').innerText = lesson.mindmap;
            document.getElementById('explanationText').innerText = lesson.explanation;
            
            renderQuiz(lesson.quiz);
            
            document.getElementById('loading').style.display = 'none';
            document.getElementById('resultArea').style.display = 'block';
        } catch (error) {
            document.getElementById('loading').style.display = 'none';
            alert("حدث خطأ، تأكدي من صحة المفتاح أو حجم الملف أو اتصال الإنترنت.");
            console.error(error);
        }
    }

    function renderQuiz(quizData) {
        const container = document.getElementById('quizContainer');
        container.innerHTML = '';
        quizData.forEach((item, index) => {
            const qBlock = document.createElement('div');
            const title = document.createElement('p');
            title.innerHTML = `<strong>س${index+1}: ${item.q}</strong>`;
            qBlock.appendChild(title);

            item.options.forEach(opt => {
                const optDiv = document.createElement('div');
                optDiv.className = 'quiz-option';
                optDiv.innerText = opt;
                optDiv.onclick = function() { checkAnswer(this, opt, item.ans); };
                qBlock.appendChild(optDiv);
            });
            container.appendChild(qBlock);
        });
    }

    function checkAnswer(element, selected, correct) {
        if (element.parentElement.dataset.answered) return;
        element.parentElement.dataset.answered = "true";
        
        if (selected === correct) {
            element.style.backgroundColor = "#c6f6d5";
            element.innerText += " ✅ (إجابة صحيحة! +10 نقاط)";
            points += 10;
            updatePointsUI();
        } else {
            element.style.backgroundColor = "#fed7d7";
            element.innerText += ` ❌ (الإجابة الصحيحة: ${correct})`;
        }
    }

    function speakText() {
        const text = document.getElementById('explanationText').innerText;
        if (!text) return;
        window.speechSynthesis.cancel();
